plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.btrestart'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.btrestart"
        minSdk 21
        // 28 on purpose: newer targets are not allowed to toggle Bluetooth
        targetSdk 28
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
